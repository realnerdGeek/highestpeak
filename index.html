<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#0A0A0D" media="(prefers-color-scheme: dark)">

<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

window.HP_STANDALONE = true;
if ('serviceWorker' in navigator) addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {}); });
</script>
</head>
<body>
<style>
/* Layout: a quiet monochrome shell. Colour comes only from each track's cover, and the player takes the tint of what is playing. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --raise:#EAEAEF; --ink:#0D0D12; --muted:#6A6A76; --line:#E2E2E9;
  --on-ink:#FFFFFF; --danger:#D92D20; --scrim:rgba(10,10,16,.45); --shadow:rgba(16,16,32,.14); --glass:rgba(255,255,255,.84);
  --cover-ink:#FFFFFF; --cover-scrim:rgba(0,0,0,.44); --mono-a:#4D4D5C; --mono-b:#1C1C24; --tint-s:80%; --tint-l:45%; --sheet:#FFFFFF; --wall-a:rgba(6,6,10,.5); --wall-b:rgba(6,6,10,.8); --sw-light:#F5F5F7; --sw-dark:#0A0A0D;
  --brand-a:#FFC94A; --brand-b:#FF4A7A; --like:#E5384F; --ft-s:72%; --ft-l:80%; --ft-a:.6;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0D; --surface:#17171C; --raise:#24242C; --ink:#F5F5F7; --muted:#9C9CA8; --line:#2A2A33;
    --on-ink:#0A0A0D; --danger:#FF6B5E; --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.55); --glass:rgba(25,25,31,.84);
    --tint-s:90%; --tint-l:72%; --sheet:#17171C; --like:#FF5C74; --ft-s:60%; --ft-l:24%; --ft-a:.75; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0D; --surface:#17171C; --raise:#24242C; --ink:#F5F5F7; --muted:#9C9CA8; --line:#2A2A33;
  --on-ink:#0A0A0D; --danger:#FF6B5E; --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.55); --glass:rgba(25,25,31,.84);
  --tint-s:90%; --tint-l:72%; --sheet:#17171C; --like:#FF5C74; --ft-s:60%; --ft-l:24%; --ft-a:.75; color-scheme:dark;
}
/* a background the person picked: force its light or dark palette, then make the surfaces see-through */
:root[data-skin="light"]{--ink:#0D0D12;--on-ink:#FFFFFF;--danger:#C4271B;--scrim:rgba(10,10,16,.45);--shadow:rgba(16,16,32,.16);--tint-s:80%;--tint-l:42%;--like:#D42B45;--ft-s:72%;--ft-l:80%;--ft-a:.6;color-scheme:light}
:root[data-skin="dark"]{--ink:#F5F5F7;--on-ink:#0A0A0D;--danger:#FF7A6E;--scrim:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.55);--tint-s:90%;--tint-l:74%;--like:#FF5C74;--ft-s:60%;--ft-l:24%;--ft-a:.75;color-scheme:dark}
:root[data-skin]{--surface:color-mix(in srgb,var(--ink) 8%,transparent);--raise:color-mix(in srgb,var(--ink) 13%,transparent);--line:color-mix(in srgb,var(--ink) 16%,transparent);--muted:color-mix(in srgb,var(--ink) 66%,transparent);--glass:color-mix(in srgb,var(--bg) 62%,transparent);--sheet:color-mix(in srgb,var(--bg) 90%,var(--ink) 10%)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.35 var(--font);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block}
#wall{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}
#wall.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--wall-a),var(--wall-b))}
.app{position:relative;z-index:1;max-width:560px;margin-inline:auto;padding-inline:18px;padding-block:18px calc(28px + var(--player-h,0px) + var(--nav-h,64px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{display:flex;align-items:center;gap:9px;min-width:0;font:500 24px/1.1 var(--font);letter-spacing:-.04em;margin:0}
h1 b{font-weight:800}
.logo{flex:none;width:32px;height:28px}
.top-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:none;white-space:nowrap;min-height:46px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;background:var(--raise);text-align:center}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.warn{color:var(--danger)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.sm{min-height:40px;padding:0 15px;font-size:14px}
.btn.wide{flex:1 1 0;min-width:0}
.btn.wide.big{flex:1.7 1 0;padding:0 12px}
.btn.xs{min-height:34px;padding:0 12px;font-size:13px}
.link{min-height:36px;font-weight:600;font-size:14px;color:var(--muted)}
.page-t{font:800 28px/1.1 var(--font);letter-spacing:-.035em;margin:18px 0 0;text-wrap:balance}
.hello .count{margin:4px 0 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 8px}
.sec-h h3{font:700 18px/1.2 var(--font);letter-spacing:-.02em;margin:0}
.strip{display:flex;gap:12px;overflow-x:auto;margin-inline:-18px;padding-inline:18px;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.tile{--h:235;flex:none;width:124px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .cover{width:124px;height:124px;border-radius:22px;margin-bottom:5px}
.tile .cover b{font-size:50px}
.tile .title{font-weight:600;font-size:14px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.cur .title{color:hsl(var(--h) var(--tint-s) var(--tint-l))}
.hint-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;background:var(--surface);box-shadow:0 1px 4px var(--shadow)}
.hint-card p{margin:0;color:var(--muted);font-size:15px}
.drop{margin-top:16px;padding:26px 18px;border-radius:26px;background:var(--surface);box-shadow:0 1px 4px var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.drop .cover{width:72px;height:72px;border-radius:22px;margin-bottom:6px}
.drop h2{font:700 20px/1.2 var(--font);letter-spacing:-.02em;margin:0}
.drop p{margin:0;color:var(--muted);font-size:15px;max-width:32ch}
.drop .btn{margin-top:8px}
.drop .works{font-size:13px;margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px 65px}
.spin{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--raise)}
.icon-btn.sm{width:40px;height:40px}

.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--raise);border-radius:14px;padding:4px;margin-top:14px}
.tab{min-height:38px;min-width:0;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted);text-align:center;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}
.tab .n{font-weight:500;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}

.notice{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--raise);font-size:14px;color:var(--muted)}
.imports{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.imports:empty{display:none}
.imp{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);font-size:14px;box-shadow:0 1px 4px var(--shadow)}
.imp .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;max-width:45%}
.imp .st{flex:1;min-width:0;color:var(--muted)}
.imp.err .st{color:var(--danger)}
.imp button{flex:none;min-width:40px;min-height:40px;font-weight:600;color:var(--muted)}

.search{display:flex;align-items:center;gap:10px;height:48px;margin-top:14px;padding:0 16px;border-radius:999px;background:var(--raise);color:var(--muted)}
.search:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;padding:0;margin:0;background:none;color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.icon-btn.active{background:var(--ink);color:var(--on-ink)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-block:14px 8px}
.bar.split{justify-content:space-between}
.bar .hint{color:var(--muted);font-size:14px;min-width:0}
.count{margin:14px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.pick{margin:0 0 4px;font-weight:600;color:var(--ink)}
.list{display:flex;flex-direction:column}
.row{--h:235;display:flex;align-items:center}
.row-hit{flex:1;min-width:0;display:grid;grid-template-columns:52px minmax(0,1fr);gap:13px;align-items:center;min-height:68px;padding:8px 0}
.tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tt .title{font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.cur .title{color:hsl(var(--h) var(--tint-s) var(--tint-l))}
.more{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.check{flex:none;width:44px;height:44px;display:grid;place-items:center}
.check i{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:var(--on-ink)}
.row.picked .check i{background:var(--ink);border-color:var(--ink)}

.cover{--h:235;position:relative;flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:3px;color:var(--cover-ink);
  background:radial-gradient(circle at var(--x1,18%) var(--y1,16%),hsl(var(--h) 94% 68%) 0,transparent 60%),radial-gradient(circle at var(--x2,82%) var(--y2,80%),hsl(var(--hb,calc(var(--h) + 50)) 92% 58%) 0,transparent 64%),hsl(var(--hc,var(--h)) 74% 36%)}
.cover.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eqo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3px;background:var(--cover-scrim)}
.cover.mono{background:linear-gradient(140deg,var(--mono-a),var(--mono-b))}
.cover i{flex:none;width:8%;min-width:3px;border-radius:99px;background:currentColor;opacity:.94}
.cover b{font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1}
.is-playing .row.cur .cover i,.is-playing .now .cover i{animation:eq .75s ease-in-out infinite alternate}
.is-playing .cover i:nth-child(2){animation-delay:-.25s}.is-playing .cover i:nth-child(3){animation-delay:-.55s}
.is-playing .cover i:nth-child(4){animation-delay:-.1s}.is-playing .cover i:nth-child(5){animation-delay:-.4s}
@keyframes eq{from{transform:scaleY(.45)}to{transform:scaleY(1.15)}}
@media (prefers-reduced-motion: reduce){.is-playing .cover i{animation:none!important}}

.empty{margin-top:44px;padding-inline:8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.empty .cover{width:76px;height:76px;border-radius:22px;margin-bottom:8px}
.empty h2{font:700 20px/1.2 var(--font);letter-spacing:-.02em;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:34ch;font-size:15px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;margin-top:6px}
.pl-row{display:flex;flex-direction:column;gap:9px;min-width:0}
.pl-row .cover{width:100%;height:auto;aspect-ratio:1;border-radius:24px}
.pl-row .cover b{font-size:68px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin-top:10px;font-weight:600;font-size:15px;color:var(--muted)}
.pl-head{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-top:6px}
.pl-head .cover{width:128px;height:128px;border-radius:30px}
.pl-head .cover b{font-size:60px}
.pl-head h2{font:800 26px/1.1 var(--font);letter-spacing:-.03em;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.pl-head .meta{color:var(--muted);font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.pl-actions{display:flex;flex-wrap:wrap;gap:8px;margin-block:16px 6px}
.storage{margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:540px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:50px;min-width:0;border-radius:14px;color:var(--muted);font:600 11px/1 var(--font)}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav .plus{width:46px;height:32px;border-radius:12px;display:grid;place-items:center;background:var(--ink);color:var(--on-ink)}
.nav .dot{position:absolute;top:5px;right:calc(50% - 27px);width:10px;height:10px;border-radius:50%;background:var(--brand-b);border:2px solid var(--sheet)}
.player{position:fixed;left:0;right:0;bottom:var(--nav-h,64px);z-index:10;padding:0 10px 8px;pointer-events:none}
.player-in{--tint:hsl(var(--hue,235) var(--tint-s) var(--tint-l));pointer-events:auto;max-width:540px;margin-inline:auto;padding:14px 16px 10px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--line);box-shadow:0 14px 40px var(--shadow);display:flex;flex-direction:column;gap:8px}
.now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:600 12px/1 var(--font);padding:6px 9px;border-radius:99px;background:var(--raise);white-space:nowrap;font-variant-numeric:tabular-nums}
.now .cover{width:44px;height:44px;border-radius:12px}
.now-t{min-width:0}
.now .title{font-weight:700;font-size:17px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wave{display:flex;align-items:center;gap:1px;height:34px;margin-top:2px;touch-action:none;cursor:pointer;border-radius:6px}
.wave i{flex:1 1 0;min-width:0;height:calc(var(--h,30)*1%);min-height:3px;background:var(--muted);opacity:.32;border-radius:99px}
.wave i.on{background:var(--tint);opacity:1}
.times{display:flex;justify-content:space-between;font:500 12px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--muted)}
.ctl{display:flex;align-items:center;justify-content:space-between}
.ctl .rnd{width:52px;height:52px;display:grid;place-items:center;border-radius:50%}
.now-btns{display:flex;align-items:center;gap:2px}
.now-btns button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.mini-only{display:none!important}
.player.mini .mini-only{display:grid!important}
.player.mini .wave,.player.mini .times,.player.mini .ctl,.player.mini .chips{display:none}
.player.mini .player-in{padding:10px 12px;border-radius:22px}
.player.mini #sizeBtn svg{transform:rotate(180deg)}
.ctl .big{width:60px;height:60px;background:var(--ink);color:var(--on-ink)}
.tog{width:64px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;color:var(--muted)}
.tog span{font:600 11px/1 var(--font);white-space:nowrap}
.tog[aria-pressed="true"]{color:var(--tint)}

.sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{width:100%;max-width:560px;max-height:86%;overflow:auto;background:var(--sheet);border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet-panel::before{content:"";flex:none;align-self:center;width:38px;height:5px;border-radius:99px;background:var(--line);margin-bottom:4px}
.sheet-panel h2{font:700 20px/1.2 var(--font);letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.sheet-panel .sub{margin:0;color:var(--muted);font-size:14px}
.sheet-head{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.opts{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;width:100%;border-bottom:1px solid var(--line);font-weight:500}
.opt:last-child{border-bottom:0}
.opt.warn{color:var(--danger)}
.opt .cover{width:36px;height:36px;border-radius:10px}
.opt .cover b{font-size:16px}
.opt .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .tick{color:var(--muted);font-weight:600;font-size:14px;min-width:22px;text-align:right}
form{display:flex;flex-direction:column;gap:14px;margin:0}
input[type="text"]{font:inherit;font-size:16px;width:100%;min-height:50px;padding:0 14px;border-radius:14px;border:1px solid transparent;background:var(--raise);color:var(--ink)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors label{display:grid;place-items:center;border-radius:50%;padding:3px;border:2px solid transparent;cursor:pointer}
.colors input{position:absolute;opacity:0;pointer-events:none}
.colors label:has(input:checked){border-color:var(--ink)}
.colors .cover{width:40px;height:40px;border-radius:50%}
.set{display:flex;align-items:center;gap:14px}
.set.col{flex-direction:column;align-items:stretch;gap:10px}
.set-t{font-weight:600}
.set .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.group{margin-top:22px}
.group h3{margin:0 4px 8px;font:600 13px/1.2 var(--font);color:var(--muted)}
.card{background:var(--surface);border-radius:20px;padding:2px 16px;box-shadow:0 1px 4px var(--shadow)}
.card .set{padding:14px 0;border-bottom:1px solid var(--line)}
.card .set:last-child{border-bottom:0}
.card .note{margin:0;padding:12px 0 14px;color:var(--muted);font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--raise);border-radius:12px;padding:4px}

/* what was played lately, and how many times each upload has been played */
let recentSent = '', recentAt = 0, recentTimer = 0;
function saveRecent(now) {
  S.recentSig = JSON.stringify(S.recent);
  if (!S.ready || !store || !store.canWrite || store.settingsOk === false) return;      // never before the saved counts have been read in
  clearTimeout(recentTimer);
  const wait = 45000 - (Date.now() - recentAt);
  if (!now && wait > 0) { recentTimer = setTimeout(() => saveRecent(true), wait); return; }      // play counts are saved every so often, not on every single loop
  const have = new Set((S.raw ? S.raw.tracks : S.tracks).map(t => t.id)), plays = {};
  for (const k in S.plays) if (have.has(k) && S.plays[k] > 0) plays[k] = S.plays[k];
  const doc = { ids: S.recent, plays }, sig = JSON.stringify(doc); if (sig === recentSent) return; recentSent = sig; recentAt = Date.now();
  Promise.resolve(store.set('settings', 'recent', doc)).catch(() => { recentSent = ''; });
}
function noteRecent(id) {
  const cur = S.recent || []; if (cur[0] === id) return;
  S.recent = [id].concat(cur.filter(x => x !== id)).slice(0, 12); saveRecent(true);
}

/* ---------- stats: time listened, plays per day, the streak ---------- */
const ST = { total: 0, best: 0, days: {}, last: 0, sent: '', at: 0, timer: 0 };
const dayKey = d => { const x = d || new Date(); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const dayAgo = n => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - n); return d; };
const statDay = k => ST.days[k] || (ST.days[k] = { s: 0, p: {} });
const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function fmtLong(sec) { const m = Math.floor((sec || 0) / 60), h = Math.floor(m / 60); return m < 1 ? '0 min' : h ? h + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : m + ' min'; }
function addListen(sec) { if (!(sec > 0)) return; ST.total += sec; statDay(dayKey()).s += sec; saveStats(false); }
/* days in a row with at least a minute listened; today only counts once it has that minute, and missing it does not break the streak until the day is over */
function streak() {
  const ok = i => { const d = ST.days[dayKey(dayAgo(i))]; return !!d && d.s >= 60; };
  let n = 0; for (let i = ok(0) ? 0 : 1; i < 400 && ok(i); i++) n++;
  return n;
}
function weekStats() {

    if (!c.preset && S.presets.length >= 24) { closeSheet(); return toast('That is as many presets as there is room for. Delete one first.'); }
    const p = { id: c.preset || 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: (e.prname.value.trim() || 'Preset ' + (S.presets.length + 1)).slice(0, 40),
      source: val('source') || 'all', shuffle: val('shuffle') === '1', loop: val('loop'), timer: +val('timer'), loops: +val('loops'), speed: +val('speed') };
    closeSheet();
    guard(async () => { await savePresets(c.preset ? S.presets.map(x => (x.id === c.preset ? p : x)) : S.presets.concat(p)); toast(c.preset ? 'Preset saved.' : 'Preset added to Home.'); });
  },
  rename(f) { const c = sheetCtx, v = f.elements.tname.value.trim(); closeSheet(); if (c && v) guard(() => store.update('tracks', c.id, { title: v.slice(0, 80) })); },
  playlist(f) {
    const c = sheetCtx || {}, name = (f.elements.pname.value.trim() || 'Playlist ' + (S.playlists.length + 1)).slice(0, 60), color = (f.elements.color && f.elements.color.value) || 'blue';
    const newCover = c.newCover, removeCover = c.removeCover, before = c.pl && playlist(c.pl);
    closeSheet();
    guard(async () => {
      const coverId = newCover ? await store.putBlob(newCover, 'image/jpeg') : null;
      if (c.pl) {
        const patch = { name, color }; if (coverId) patch.cover = coverId; else if (removeCover) patch.cover = null;
        await store.update('playlists', c.pl, patch);
        if ((coverId || removeCover) && before && before.cover) store.delBlob(before.cover);
      } else {
        const many = Array.isArray(c.addTrack), id = store.id(), doc = { name, color, tracks: c.addTrack ? [].concat(c.addTrack) : [], created: Date.now() }; if (coverId) doc.cover = coverId;
        await store.set('playlists', id, doc);

      }
    });
  }
};
document.addEventListener('click', e => {
  if (Date.now() < swipeBlock && swipeRow && swipeRow.contains(e.target)) { e.preventDefault(); return; }       // the tap that ends a swipe on a row is not a tap on it
  if (e.target === $('#sheet')) return closeSheet();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  tapAt = Date.now(); tapPlaying = !!track(P.cur) && !audio.paused && !P.countIn;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset, el, e);
});
document.addEventListener('submit', e => { e.preventDefault(); const h = FORM[e.target.dataset.form]; if (h) h(e.target); });
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (VID.open) closeVideo(); else if (sheetOpen()) closeSheet(); else if (S.full) closeFull(); });

/* ---------- data in ---------- */
function onData(d) {
  S.raw = d;
  DEL.done.forEach(id => { if (!d.tracks.some(t => t.id === id)) { DEL.done.delete(id); S.gone.delete(id); } });
  S.tracks = d.tracks.filter(t => !S.gone.has(t.id)).sort((a, b) => (b.created || 0) - (a.created || 0));
  LIKE_WAIT.forEach((v, id) => { const t = track(id); if (!t || isLiked(t) === !!v) LIKE_WAIT.delete(id); else t.liked = v; });      // a like that is still on its way wins over an older copy
  S.playlists = d.playlists.slice().sort((a, b) => (a.created || 0) - (b.created || 0));
  const first = !S.ready; S.ready = true;
  const sets = d.settings || [], ui = sets.find(x => x.id === 'ui') || null, sig = JSON.stringify(ui && ui.bg || { kind: 'default' });
  if (sig !== S.bgSig) { S.bgSig = sig; S.ui = ui; applyBg(); }
  const saved = sets.find(x => x.id === 'opts');
  if (saved) { const c = cleanOpts(saved), osig = JSON.stringify(c); if (osig !== S.optSig) { S.opt = c; S.optSig = osig; try { localStorage.setItem('gymtapes.opts', osig); } catch (e) { /* not kept */ } applyRate(); } }
  if (S.sel) { const have = new Set(S.tracks.map(t => t.id)); S.sel.forEach(id => { if (!have.has(id)) S.sel.delete(id); }); }
  const rec = sets.find(x => x.id === 'recent'), rids = rec && Array.isArray(rec.ids) ? rec.ids.filter(x => typeof x === 'string') : [], rsig = JSON.stringify(rids);
  if (rsig !== S.recentSig && !(rids.length === 0 && S.recent.length)) { S.recent = rids; S.recentSig = rsig; }
  const rp = rec && rec.plays && typeof rec.plays === 'object' ? rec.plays : {};
  for (const k in rp) { const n = Math.round(+rp[k] || 0); if (n > (S.plays[k] || 0)) S.plays[k] = n; }
  const pr = sets.find(x => x.id === 'presets'), plist = cleanPresets(pr && pr.list), psig = JSON.stringify(plist);
  if (psig !== S.presetSig) { S.presets = plist; S.presetSig = psig; }
  mergeStats(sets.find(x => x.id === 'stats'));
  if (first) { freezeHome(); restoreSession(); }
  if (S.pl && S.pl !== LIKED && !playlist(S.pl)) S.pl = null;
  if (P.order.length) {
    const have = new Set(S.tracks.map(t => t.id));
    if (P.cur && !have.has(P.cur)) stopPlayer();
    else if (P.order.some(id => !have.has(id))) { P.queue = P.queue.filter(id => have.has(id)); P.order = P.order.filter(id => have.has(id)); P.pos = Math.max(0, P.order.indexOf(P.cur)); }
  }
  if (S.opt.sections) S.tracks.forEach(t => { if (secWanted(t)) buildSection(t); });
  const now = track(P.cur);
  if (now && !P.countIn) {
    if (now.asset !== P.asset) { audio.pause(); setTrack(now, false); }                                  // its audio was replaced by an edit
    else if ((secWanted(now) ? secKey(now) : '') !== P.secSig || engineFor() !== audio) reloadKeep();     // its section, or a sound option, changed
    else applyGain();
  }
  render(); updatePlayer();
  if (!$('#sheet').hidden && sheetCtx) { if (sheetCtx.kind === 'addto' && track(sheetCtx.id)) addToPlaylistSheet(sheetCtx.id); else if (sheetCtx.kind === 'addtracks' && playlist(sheetCtx.pl)) addTracksSheet(sheetCtx.pl); }
}
function note(msg) { const n = $('#notice'); n.textContent = msg || ''; n.hidden = !msg; }
async function boot() {
  let db = null, assets = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { [db, assets, DL] = await Promise.all([window.claude.use('db'), window.claude.use('assets'), window.claude.use('downloads')]); } catch (e) { db = null; }
  }
  if (db) {
    store = makeCloudStore(db, assets);
    if (!assets) note('You can play this library, but only its owner can add or change uploads.');
  } else {
    store = await makeLocalStore();
    if (window.HP_STANDALONE) {
      if (!store.persistent) note('This phone is not letting the app save anything right now. What you upload will be gone when you close it.');
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* fine */ }      // ask the phone to keep the library even when space runs low
    } else note(store.persistent ? 'Not connected to your saved library right now. What you upload here stays on this device only.' : 'This browser is not letting the page save anything. What you upload will be gone when you close it.');
  }
  store.watch(onData, () => note('Lost the connection to your library. Reload the page.'));
  refreshUsage();
}
try { const b = JSON.parse(localStorage.getItem('gymtapes.bg') || 'null'); if (b && b.kind !== 'wall') { S.ui = { bg: b }; applyBg(); } } catch (e) { /* default look */ }
render(); updatePlayer();
boot();
window.__gymTapes = { MP4, VCUT, VID, prepVideo, videoBlob, S, P, ED, Ending, T, FX, SEC, PRE, UP, ST, VOL, stripAdts, pickEncoder, zipBlob, zipRead, joinKey, addListen: s => addListen(s), saveStats: () => saveStats(true), get audio() { return audio; }, get store() { return store; } };
})();
